name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.14"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Provision Copilot runtime
        if: matrix.python-version == '3.14'
        run: uv run python -m copilot download-runtime
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv build
      - name: Smoke-test built wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv run --isolated --no-project --with "$wheel" dependabot-validator-grunt --version
          uv run --isolated --no-project --with "$wheel" python -c \
            "from dependabot_validator_grunt.agent_capabilities import load_investigator_capability_catalog; from dependabot_validator_grunt.copilot_assets import load_investigator_assets; [load_investigator_assets(capability) for capability in load_investigator_capability_catalog().capabilities]"
