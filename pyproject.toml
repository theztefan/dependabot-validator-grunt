[project]
name = "dependabot-validator-grunt"
dynamic = ["version"]
description = "A read-only CLI for evidence-backed Dependabot dismissal review and alert triage."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ast-grep-cli==0.45.3",
    "github-copilot-sdk>=1.0.13",
    "packaging>=25.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[tool.uv]
no-build-package = ["ast-grep-cli"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[project.scripts]
dependabot-validator-grunt = "dependabot_validator_grunt.main:entrypoint"

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dependabot_validator_grunt"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dependabot_validator_grunt",
    "examples/offline-cases",
    "README.md",
    "LICENSE",
]

[tool.hatch.version]
path = "src/dependabot_validator_grunt/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires network access or credentials",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
